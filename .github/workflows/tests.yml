name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -m 'not integration'

  distribution:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Smoke-test built wheel
        shell: bash
        run: |
          python -m venv "${RUNNER_TEMP}/pg-configurator-wheel-smoke"
          "${RUNNER_TEMP}/pg-configurator-wheel-smoke/bin/python" -m pip install dist/*.whl
          "${RUNNER_TEMP}/pg-configurator-wheel-smoke/bin/pg-configurator" --version
          "${RUNNER_TEMP}/pg-configurator-wheel-smoke/bin/pg-configurator" \
            --db-cpu=8 --db-ram=16Gi --pg-version=18 --output-format=json \
            > "${RUNNER_TEMP}/candidate.json"
          "${RUNNER_TEMP}/pg-configurator-wheel-smoke/bin/python" -m json.tool \
            "${RUNNER_TEMP}/candidate.json" >/dev/null
          "${RUNNER_TEMP}/pg-configurator-wheel-smoke/bin/python" -c \
            'from pg_configurator import __version__; assert __version__'

  docker-integration:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: unit
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: python -m pip install -e '.[test]'
      - env:
          PG_CONFIGURATOR_DOCKER_INTEGRATION: "1"
        run: pytest -m integration
