<body class="pv">
<div class="pc-wrap">
  <div class="pc-top">
    <div>
      <h1 class="pc-title">pg-configurator<small>Explainable, hardware-aware PostgreSQL configuration</small></h1>
      <div class="pc-ident">
        <span>version <span id="version">0.0.0</span></span>
        <a class="pc-link" href="https://github.com/O2eg/pg_configurator" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <path d="M5 3.5h6.5a1 1 0 0 1 1 1V13"></path>
            <path d="M4 2.5h6.5a1 1 0 0 1 1 1v9.5"></path>
            <path d="M4 2.5A1.5 1.5 0 0 0 2.5 4v8A1.5 1.5 0 0 1 4 10.5h8.5"></path>
          </svg>
          <span>github.com/O2eg/pg_configurator</span>
        </a>
        <a class="pc-link" href="https://o2eg.com/" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <circle cx="8" cy="8" r="5.5"></circle>
            <path d="M2.5 8h11"></path>
            <path d="M8 2.5c1.7 1.5 2.6 3.3 2.6 5.5S9.7 12 8 13.5C6.3 12 5.4 10.2 5.4 8S6.3 4 8 2.5Z"></path>
          </svg>
          <span>o2eg.com</span>
        </a>
        <a class="pc-link" href="https://t.me/O2egg" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <path d="M14 2.5 2 7.4l4.3 1.5"></path>
            <path d="M14 2.5 9.5 13.5 6.3 8.9"></path>
            <path d="M6.3 8.9 10 5.8"></path>
          </svg>
          <span>t.me/O2egg</span>
        </a>
      </div>
    </div>
    <div class="spacer"></div>
    <label class="pc-theme-toggle" title="Switch theme">
      <span>Dark</span>
      <input id="theme" type="checkbox">
      <span>Light</span>
    </label>
  </div>

  <div class="pc-tabrow">
    <div class="pc-tabs" id="tabs" role="tablist" aria-label="Configuration views"></div>
    <div class="pc-actions" id="actions"></div>
  </div>
  <div id="panels"></div>
  <!-- The form moves this into the Main panel, between the fields and the
       settings they produce; it lives here only so the markup stays declarative. -->
  <div class="pc-error pc-error-quiet" id="error" role="alert"></div>
</div>

<script type="application/json" id="pgc-rules">{}</script><!--PC:DATA-RULES-->
<script type="application/json" id="pgc-pg-settings">{}</script><!--PC:DATA-SETTINGS-->
<script type="application/json" id="pgc-input-schema">{}</script><!--PC:DATA-SCHEMA-->

<script type="module"><!--PC:JS-CORE-->
import { ConfiguratorPage } from './src/render.js';
const readJson = (id) => JSON.parse(document.getElementById(id).textContent);
const schemaDocument = readJson('pgc-input-schema');
const page = new ConfiguratorPage(document, {
  rules: readJson('pgc-rules').payload,
  pgSettings: readJson('pgc-pg-settings').payload,
  schema: schemaDocument.payload,
  version: schemaDocument.package_version,
});
document.getElementById('version').textContent = schemaDocument.package_version;
page.mount();

const toggle = document.getElementById('theme');
const applyTheme = () => {
  document.documentElement.setAttribute('data-pv-theme', toggle.checked ? 'light' : 'dark');
};
toggle.addEventListener('change', () => {
  applyTheme();
  try {
    localStorage.setItem('pgc-theme', toggle.checked ? 'light' : 'dark');
  } catch {
    // Storage can be unavailable; the toggle still works for this visit.
  }
});
try {
  const stored = localStorage.getItem('pgc-theme');
  if (stored) toggle.checked = stored === 'light';
} catch {
  // ignored, see above
}
applyTheme();
</script>
</body>
